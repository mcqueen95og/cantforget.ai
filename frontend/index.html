<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cantforget.ai — Face &amp; Voice</title>
  <link rel="stylesheet" href="/static/css/main.css?v=14" />
</head>
<body>
  <!-- Full-page camera feed -->
  <div class="feed">
    <video id="localVideo" autoplay playsinline muted></video>
    <canvas id="overlayCanvas" class="overlay"></canvas>
    <div id="errorBox" class="error-box hidden"></div>
  </div>

  <button id="menuBtn" class="icon-btn menu-btn" aria-label="Menu">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7" />
      <line x1="4" y1="12" x2="20" y2="12" />
      <line x1="4" y1="17" x2="20" y2="17" />
    </svg>
  </button>

  <header class="brand">cantforget.ai</header>

  <div class="feed-controls">
    <button id="cameraToggleBtn" class="icon-btn" aria-label="Turn camera on" title="Camera">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6.5" width="14" height="11" rx="2.5" />
        <path d="M16.5 10.5 21 8v8l-4.5-2.5" />
      </svg>
    </button>
    <button id="micToggleBtn" class="icon-btn" aria-label="Turn microphone on" title="Microphone" disabled>
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3" />
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" />
        <line x1="12" y1="18" x2="12" y2="21" />
        <line x1="8.5" y1="21" x2="15.5" y2="21" />
      </svg>
    </button>
  </div>

  <button id="helpBtn" class="icon-btn help-btn" aria-label="Show the tutorial" title="Show the tutorial">
    <span aria-hidden="true">?</span>
  </button>

  <div id="sideOverlay" class="side-overlay hidden"></div>

  <!-- Side panel drawer -->
  <aside id="sidePanel" class="side-panel">
    <button id="closeMenuBtn" class="icon-btn icon-btn--small panel-close" aria-label="Close menu">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </button>

    <nav class="panel-tabs" id="panelTabs">
      <button class="panel-tab active" data-tab="tab-conversation">Conversation</button>
      <button class="panel-tab" data-tab="tab-people">People</button>
    </nav>

    <div class="tab-page" id="tab-conversation">
      <div id="transcriptList" class="transcript-list">
        <div class="transcript-empty">Start the microphone to see conversation.</div>
      </div>
      <div id="speakerStats" class="speaker-stats"></div>

      <h2>Key points</h2>
      <div id="keyPointsList" class="key-points-list">
        <div class="key-points-empty">Live key points appear here while you talk.</div>
      </div>
    </div>

    <div class="tab-page hidden" id="tab-people">
      <h2>Registered People</h2>
      <div id="peopleList" class="people-list">
        <div class="empty">Loading...</div>
      </div>

      <details class="add-person">
        <summary>Add a person from photos</summary>
        <form id="addPersonForm">
          <label class="field"><span>Name</span><input name="name" type="text" maxlength="80" required /></label>
          <label class="field"><span>Tag (e.g. relationship)</span><input name="tag" type="text" maxlength="40" /></label>
          <label class="field"><span>Short description</span><textarea name="description" rows="2" maxlength="500"></textarea></label>
          <label class="field"><span>Photos (one clear face each)</span><input name="photos" type="file" accept="image/*" multiple required /></label>
          <label class="consent">
            <input name="consent" type="checkbox" required />
            <span>I have this person's permission, and the user's, to store their face data on this device for recognition.</span>
          </label>
          <div id="addPersonMsg" class="form-msg"></div>
          <button type="submit" class="btn btn--small btn--primary">Register</button>
        </form>
      </details>
    </div>
  </aside>

  <!-- Welcome tutorial: shown every time the app opens -->
  <div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" hidden>
    <div class="welcome-card">
      <div class="welcome-skip-row">
        <button id="welcomeClose" class="welcome-link" type="button">Skip</button>
      </div>
      <div id="welcomeBody" class="welcome-body" aria-live="polite"></div>
      <div id="welcomeDots" class="welcome-dots" aria-hidden="true"></div>
      <div class="welcome-nav">
        <button id="welcomeBack" class="welcome-back" type="button">&larr; Back</button>
        <button id="welcomeNext" class="welcome-next" type="button"></button>
      </div>
      <button id="welcomeAgain" class="welcome-link welcome-again" type="button" hidden>Show tutorial again</button>
    </div>
  </div>

  <script type="module" src="/static/js/welcome.js?v=2"></script>
  <script type="module" src="/static/js/app.js?v=13"></script>
  <script type="module" src="/static/js/audio.js?v=6"></script>
  <script type="module" src="/static/js/conversation.js?v=10"></script>
  <script type="module" src="/static/js/conversation-intelligence.js?v=3"></script>
</body>
</html>
